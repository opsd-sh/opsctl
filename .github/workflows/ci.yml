name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test on Rust ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.86.0"
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        run: >-
          rustup toolchain install ${{ matrix.rust }}
          --profile minimal
          --component clippy,rustfmt

      - name: Check formatting
        run: cargo +${{ matrix.rust }} fmt --check

      - name: Run tests
        run: cargo +${{ matrix.rust }} test --locked

      - name: Run Clippy
        run: >-
          cargo +${{ matrix.rust }} clippy
          --locked
          --all-targets
          --all-features
          --
          -D warnings
