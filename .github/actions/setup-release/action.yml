name: Set up release build
description: Install the dist version pinned in dist-workspace.toml

inputs:
  install-dist:
    description: Whether to install the dist version pinned in dist-workspace.toml
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install dist
      if: ${{ inputs.install-dist == 'true' }}
      shell: bash
      env:
        CARGO_DIST_NO_MODIFY_PATH: "1"
      run: |
        version="$(awk -F '"' '/^cargo-dist-version = / { print $2 }' opsctl/dist-workspace.toml)"
        test -n "$version"
        curl --proto '=https' --tlsv1.2 -LsSf \
          "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" \
          -o dist-installer.sh
        sh dist-installer.sh
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
