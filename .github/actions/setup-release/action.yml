name: Set up release build
description: Check out the pinned private SDK and optionally install dist

inputs:
  opsd-rust-token:
    description: Token with read access to opsd-sh/opsd-rust
    required: true
  install-dist:
    description: Whether to install the dist version pinned in dist-workspace.toml
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Read pinned opsd-rust revision
      id: sdk
      shell: bash
      run: echo "revision=$(tr -d '[:space:]' < ops/opsd-rust.rev)" >> "$GITHUB_OUTPUT"

    - name: Check out pinned opsd-rust
      uses: actions/checkout@v6
      with:
        repository: opsd-sh/opsd-rust
        ref: ${{ steps.sdk.outputs.revision }}
        token: ${{ inputs.opsd-rust-token }}
        path: opsd-rust
        persist-credentials: false

    - name: Install dist
      if: ${{ inputs.install-dist == 'true' }}
      shell: bash
      env:
        CARGO_DIST_NO_MODIFY_PATH: "1"
      run: |
        version="$(awk -F '"' '/^cargo-dist-version = / { print $2 }' ops/dist-workspace.toml)"
        test -n "$version"
        curl --proto '=https' --tlsv1.2 -LsSf \
          "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" \
          -o dist-installer.sh
        sh dist-installer.sh
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
