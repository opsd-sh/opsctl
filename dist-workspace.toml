[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
dist = true
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
]
hosting = ["simple", "github"]
simple-download-url = "https://downloads.opsd.sh/opsctl/releases/{tag}"
source-tarball = false
install-path = "~/.local/bin"
