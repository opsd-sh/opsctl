[package]
name = "ops"
version = "0.1.0"
edition = "2024"
description = "CLI for the Opsd API"
repository = "https://github.com/opsd-sh/ops"
publish = false

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
opsd-rust = { path = "../opsd-rust" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
url = "2.5.7"

[profile.dist]
inherits = "release"
lto = "thin"
